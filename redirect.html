<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #222222;
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-weight: 500;
            font-size: 20px;
            letter-spacing: 0.5px;
        }
        p {
            color: #888888;
            font-size: 14px;
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', (event) => {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');
            
            let targetUrl = '';
            let appIntent = '';

            if (type === 'ig') {
                const user = params.get('user');
                appIntent = `intent://instagram.com/_u/${user}/#Intent;package=com.instagram.android;scheme=https;end;`;
                targetUrl = `https://www.instagram.com/${user}`;
            } 
            else if (type === 'wa') {
                const to = params.get('to');
                const text = params.get('text') || '';
                appIntent = `whatsapp://send?phone=${to}&text=${encodeURIComponent(text)}`;
                targetUrl = `https://wa.me/${to}?text=${encodeURIComponent(text)}`;
            } 
            else if (type === 'yt') {
                const channel = params.get('channel');
                appIntent = `intent://www.youtube.com/@${channel}/#Intent;package=com.google.android.youtube;scheme=https;end;`;
                targetUrl = `https://www.youtube.com/@${channel}`;
            } 
            else if (type === 'fb') {
                const user = params.get('user');
                appIntent = `intent://facebook.com/${user}/#Intent;package=com.facebook.katana;scheme=https;end;`;
                targetUrl = `https://www.facebook.com/${user}`;
            } 
            else if (type === 'web' || type === 'menu' || type === 'custom') {
                targetUrl = params.get('url');
                appIntent = targetUrl;
            }
            else if (type === 'wifi') {
                const ssid = params.get('ssid');
                const pass = params.get('pass');
                // Wi-Fi Direct Connect URI
                targetUrl = `WIFI:S:${ssid};T:WPA;P:${pass};;`;
                appIntent = targetUrl;
            }

            if (appIntent) {
                // Turant app ya target par redirect karega
                window.location.href = appIntent;
                
                // Fallback agar app install na ho toh web version khol dega
                setTimeout(function() {
                    if (targetUrl) {
                        window.location.href = targetUrl;
                    }
                }, 800);
            } else {
                document.getElementById('status-text').innerText = "Invalid Link Provided!";
            }
        });
    </script>
</head>
<body>
    <div class="loader"></div>
    <h2 id="status-text">Opening App...</h2>
    <p>Please wait a moment</p>
</body>
</html>
